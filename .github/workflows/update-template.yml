name: Update Template CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      # `update-template` rewrites .github/workflows/*.yml. GitHub refuses that
      # push for any GitHub App token -- the default GITHUB_TOKEN included -- with
      # "refusing to allow a GitHub App to create or update workflow ... without
      # `workflows` permission". Only a PAT carrying the `workflow` scope, or a
      # GitHub App granted Workflows: write, can do it. Secrets cannot be read in a
      # step-level `if:`, so surface the check as env first. See PR #217.
      HAS_WORKFLOW_WRITE: ${{ (vars.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '') || secrets.GH_PAT != '' }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update template
        # Skipped while this repository has neither GH_PAT nor a GitHub App: the
        # push is rejected and takes every step below it down with it. Resumes on
        # its own once either credential exists -- no edit needed here.
        if: env.HAS_WORKFLOW_WRITE == 'true'
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
