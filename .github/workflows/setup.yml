name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read in a step-level `if:`; surface it as env first.
      HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      # `update-template` rewrites .github/workflows/*.yml. GitHub refuses that push
      # for any GitHub App token -- including the default GITHUB_TOKEN -- with
      # "refusing to allow a GitHub App to create or update workflow ... without
      # `workflows` permission". No `permissions:` value grants it; only a PAT (or a
      # custom App) carrying the `workflow` scope can, supplied as the GH_PAT secret
      # these workflows already reference.
      #
      # This repository has never had that secret: .github/workflows/ has exactly two
      # commits in its entire history -- the initial import and the v1.44.0 pin in
      # #216 -- so this step has never once succeeded, and it fails the job before any
      # later step runs.
      #
      # Skipping it when GH_PAT is absent turns a guaranteed red X into a green run
      # that does the work it actually can. If GH_PAT is ever configured the step
      # resumes on its own, with no edit here.
      - name: Update template
        if: env.HAS_GH_PAT == 'true'
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Graphs CI
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@v3.7.3
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
